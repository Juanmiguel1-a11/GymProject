<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gym Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Gym Management System</h1>
    </header>

    <section class="container">

        <h2>Registrar Miembro</h2>

        <form id="memberForm">

            <input type="text"
                   id="firstName"
                   placeholder="Nombre"
                   required>

            <input type="text"
                   id="lastName"
                   placeholder="Apellido"
                   required>

            <input type="email"
                   id="email"
                   placeholder="Correo"
                   required>

            <input type="text"
                   id="phone"
                   placeholder="Teléfono"
                   required>

            <input type="date"
                   id="dateOfBirth"
                   required>

            <select id="membershipType">
                <option value="0">Basic</option>
                <option value="1">Premium</option>
                <option value="2">VIP</option>
            </select>

            <button type="submit">
                Registrar
            </button>

        </form>

        <hr>

        <h2>Lista de Miembros</h2>

        <button onclick="loadMembers()">
            Cargar Miembros
        </button>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Membresía</th>
                </tr>
            </thead>

            <tbody id="membersTable">

            </tbody>

        </table>

    </section>

    <script src="js/app.js"></script>

</body>
</html>
